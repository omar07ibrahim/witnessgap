<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">Built-in control outcomes on the validated Workspace-100 candidate</title>
  <desc id="visual-description">Grouped horizontal bars show exact decisive-coverage and false-certainty-incidence rates for four frozen rule-based controls in the validated development candidate. The controls are descriptive protocol checks, not competitive systems. All 1,200 worker runs produced claims and zero worker failures.</desc>
