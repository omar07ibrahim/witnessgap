<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">Reproducible setup and current verification coverage</title>
  <desc id="visual-description">A source-derived setup flow from the pinned Python version, exact hashed development lock, package metadata, distribution verifier, and current GitHub Actions workflow. CI installs the editable package, checks source with Ruff and strict mypy, proves byte-identical repeated sdist and wheel builds, validates their archive and metadata surfaces, and probes the wheel in a clean environment. It also validates candidate evidence and README visuals, smoke-tests the installed CLI, and runs pytest. The boundary panel states what these local gates do not establish.</desc>
  <rect x="0" y="0" width="1600" height="1200" fill="#08111f"/>
  <text x="60" y="52" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2" textLength="417" lengthAdjust="spacingAndGlyphs">WITNESSGAP / COMMITTED SETUP CONTRACT</text>
  <text x="60" y="98" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0" textLength="1307" lengthAdjust="spacingAndGlyphs">Pinned runtime → hashed install → validated wheel → current CI</text>
  <text x="60" y="132" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" textLength="960" lengthAdjust="spacingAndGlyphs">Every listed gate is configured today; explicit trust and isolation boundaries remain.</text>
  <rect x="60" y="180" width="340" height="240" rx="18" fill="#111f33" stroke="#6eb7ff" stroke-width="2"/>
  <text x="84" y="219" fill="#6eb7ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1" textLength="108" lengthAdjust="spacingAndGlyphs">01 · RUNTIME</text>
  <text x="84" y="270" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="224" lengthAdjust="spacingAndGlyphs">.python-version = 3.12.3</text>
  <text x="84" y="312" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="279" lengthAdjust="spacingAndGlyphs">requires-python = &gt;=3.12,&lt;3.13</text>
  <text x="84" y="354" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="205" lengthAdjust="spacingAndGlyphs">CI: Ubuntu 24.04 · x64</text>
  <line x1="400" y1="300" x2="440" y2="300" stroke="#58d6c9" stroke-width="3" stroke-linecap="round"/>
  <polygon points="440,300 427,292 427,308" fill="#58d6c9"/>
  <rect x="440" y="180" width="340" height="240" rx="18" fill="#111f33" stroke="#58d6c9" stroke-width="2"/>
  <text x="464" y="219" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1" textLength="190" lengthAdjust="spacingAndGlyphs">02 · HASHED TOOLCHAIN</text>
  <text x="464" y="270" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="159" lengthAdjust="spacingAndGlyphs">16 exact packages</text>
  <text x="464" y="312" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="214" lengthAdjust="spacingAndGlyphs">16 SHA-256 wheel hashes</text>
  <text x="464" y="354" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="159" lengthAdjust="spacingAndGlyphs">hatchling==1.27.0</text>
  <line x1="780" y1="300" x2="820" y2="300" stroke="#58d6c9" stroke-width="3" stroke-linecap="round"/>
  <polygon points="820,300 807,292 807,308" fill="#58d6c9"/>
  <rect x="820" y="180" width="340" height="240" rx="18" fill="#111f33" stroke="#b8a1ff" stroke-width="2"/>
  <text x="844" y="219" fill="#b8a1ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1" textLength="190" lengthAdjust="spacingAndGlyphs">03 · EDITABLE PACKAGE</text>
  <text x="844" y="270" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="84" lengthAdjust="spacingAndGlyphs">--no-deps</text>
  <text x="844" y="312" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="186" lengthAdjust="spacingAndGlyphs">--no-build-isolation</text>
  <text x="844" y="354" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="298" lengthAdjust="spacingAndGlyphs">witnessgap → witnessgap.cli:main</text>
  <line x1="1160" y1="300" x2="1200" y2="300" stroke="#58d6c9" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1200,300 1187,292 1187,308" fill="#58d6c9"/>
  <rect x="1200" y="180" width="340" height="240" rx="18" fill="#111f33" stroke="#82e39c" stroke-width="2"/>
  <text x="1224" y="219" fill="#82e39c" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1" textLength="135" lengthAdjust="spacingAndGlyphs">04 · CURRENT CI</text>
  <text x="1224" y="270" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="270" lengthAdjust="spacingAndGlyphs">lint/type: src + test + tools</text>
  <text x="1224" y="312" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="214" lengthAdjust="spacingAndGlyphs">4 reproducibility gates</text>
  <text x="1224" y="354" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" textLength="270" lengthAdjust="spacingAndGlyphs">pytest: configured test suite</text>
  <rect x="60" y="470" width="720" height="445" rx="18" fill="#0e2630" stroke="#82e39c" stroke-width="2"/>
  <text x="88" y="510" fill="#82e39c" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="261" lengthAdjust="spacingAndGlyphs">CURRENT CI · INSTALL + QUALITY</text>
  <text x="88" y="552" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0" textLength="142" lengthAdjust="spacingAndGlyphs">HASH-LOCKED INSTALL</text>
  <text x="88" y="584" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="547" lengthAdjust="spacingAndGlyphs">python -m pip install --require-hashes -r requirements-dev.lock</text>
  <text x="88" y="615" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="565" lengthAdjust="spacingAndGlyphs">python -m pip install --no-deps --no-build-isolation --editable .</text>
  <text x="88" y="680" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0" textLength="105" lengthAdjust="spacingAndGlyphs">QUALITY CHECKS</text>
  <text x="88" y="714" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" textLength="264" lengthAdjust="spacingAndGlyphs">ruff check src test tools</text>
  <text x="88" y="756" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" textLength="296" lengthAdjust="spacingAndGlyphs">mypy --strict src test tools</text>
  <text x="88" y="798" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" textLength="64" lengthAdjust="spacingAndGlyphs">pytest</text>
  <text x="88" y="862" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="408" lengthAdjust="spacingAndGlyphs">CI source scope is literal: src + test + tools.</text>
  <text x="88" y="889" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="374" lengthAdjust="spacingAndGlyphs">pytest discovers test/ from pyproject.toml.</text>
  <rect x="820" y="470" width="720" height="445" rx="18" fill="#211c37" stroke="#b8a1ff" stroke-width="2"/>
  <text x="848" y="510" fill="#b8a1ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="296" lengthAdjust="spacingAndGlyphs">CURRENT CI · REPRODUCIBILITY GATES</text>
  <text x="848" y="550" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0" textLength="298" lengthAdjust="spacingAndGlyphs">01 · CANDIDATE RECEIPT LOCAL-DRIFT CHECK</text>
  <text x="848" y="581" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="461" lengthAdjust="spacingAndGlyphs">python tools/workspace100_candidate_evidence.py check</text>
  <text x="848" y="628" fill="#6eb7ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0" textLength="261" lengthAdjust="spacingAndGlyphs">02 · README VISUAL SOURCE FRESHNESS</text>
  <text x="848" y="659" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="374" lengthAdjust="spacingAndGlyphs">python tools/render_readme_visuals.py check</text>
  <text x="848" y="706" fill="#ffd166" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0" textLength="298" lengthAdjust="spacingAndGlyphs">03 · REPEATED SDIST → WHEEL → CLEAN VENV</text>
  <text x="848" y="737" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="304" lengthAdjust="spacingAndGlyphs">python tools/verify_distribution.py</text>
  <text x="848" y="784" fill="#82e39c" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0" textLength="246" lengthAdjust="spacingAndGlyphs">04 · INSTALLED CONSOLE ENTRYPOINT</text>
  <text x="848" y="815" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="157" lengthAdjust="spacingAndGlyphs">witnessgap example</text>
  <rect x="848" y="852" width="410" height="42" rx="21" fill="#163022" stroke="#82e39c" stroke-width="2"/>
  <text x="1053" y="880" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0" textLength="268" lengthAdjust="spacingAndGlyphs">4 / 4 present in current CI</text>
  <rect x="60" y="950" width="1480" height="120" rx="12" fill="#2b1d28" stroke="#ff7b86" stroke-width="2"/>
  <text x="88" y="988" fill="#ff7b86" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0" textLength="315" lengthAdjust="spacingAndGlyphs">BOUNDARIES THESE CI GATES DO NOT CHANGE</text>
  <text x="88" y="1030" fill="#ffd7db" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="356" lengthAdjust="spacingAndGlyphs">local root pins ≠ external authentication</text>
  <text x="578" y="1030" fill="#ffd7db" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="382" lengthAdjust="spacingAndGlyphs">CLI smoke ≠ full 1,200-run candidate capture</text>
  <text x="1068" y="1030" fill="#ffd7db" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="313" lengthAdjust="spacingAndGlyphs">local backend ≠ hostile-code sandbox</text>
  <line x1="60" y1="1114" x2="1540" y2="1114" stroke="#2d4665" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="1132" width="170" height="42" rx="21" fill="#2b1d28" stroke="#ff7b86" stroke-width="2"/>
  <text x="145" y="1160" fill="#ffd7db" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0" textLength="149" lengthAdjust="spacingAndGlyphs">official: false</text>
  <text x="250" y="1148" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="851" lengthAdjust="spacingAndGlyphs">source: .python-version · requirements-dev.lock · pyproject.toml · ci.yml · verify_distribution.py</text>
  <text x="250" y="1172" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="764" lengthAdjust="spacingAndGlyphs">nonclaim: local gates do not establish external auth, full capture replay, or sandboxing</text>
</svg>
