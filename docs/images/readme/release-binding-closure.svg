  <text x="84" y="295" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="209" lengthAdjust="spacingAndGlyphs">public_vocabulary_digest</text>
  <text x="84" y="332" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="148" lengthAdjust="spacingAndGlyphs">baseline_set_root</text>
