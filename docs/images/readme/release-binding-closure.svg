<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">Workspace-100 release binding closure</title>
  <desc id="visual-description">All twenty-five fields of the production Workspace100ReleaseBindings dataclass are grouped into content roots, implementation identities, execution configuration, and an externally supplied trust-anchor set. File descriptors form an artifact tree root; the manifest payload forms a release root that must match an independently obtained expected root.</desc>
  <rect x="0" y="0" width="1440" height="1180" fill="#08111f"/>
  <text x="60" y="52" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2" textLength="371" lengthAdjust="spacingAndGlyphs">WORKSPACE-100 / INTEGRITY CLOSURE</text>
  <text x="60" y="98" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0" textLength="1350" lengthAdjust="spacingAndGlyphs">25 direct bindings close over data, code, execution, and anchors</text>
  <text x="60" y="132" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" textLength="1027" lengthAdjust="spacingAndGlyphs">Authentication still begins outside the candidate: the expected release root is independent.</text>
  <rect x="60" y="180" width="620" height="415" rx="18" fill="#111f33" stroke="#6eb7ff" stroke-width="2"/>
  <text x="84" y="215" fill="#6eb7ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1" textLength="163" lengthAdjust="spacingAndGlyphs">CONTENT ROOTS · 14</text>
