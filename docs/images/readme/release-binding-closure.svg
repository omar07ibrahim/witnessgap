  <text x="744" y="766" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="148" lengthAdjust="spacingAndGlyphs">trust_anchor_root</text>
  <rect x="60" y="635" width="620" height="140" rx="18" fill="#0e2630" stroke="#58d6c9" stroke-width="2"/>
