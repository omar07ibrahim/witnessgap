  <text x="744" y="384" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="252" lengthAdjust="spacingAndGlyphs">scoring_implementation_digest</text>
