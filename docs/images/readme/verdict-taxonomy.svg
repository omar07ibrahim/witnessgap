<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">WitnessGap verdict taxonomy</title>
  <desc id="visual-description">All five verdict forms from the production VerdictKind enum. The Workspace-100 v1 participant claim schema admits only identified_singleton and not_identifiable; the other verdicts belong to the wider WitnessGap contract.</desc>
  <rect x="0" y="0" width="1440" height="920" fill="#08111f"/>
  <text x="60" y="52" fill="#58d6c9" font-family="monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">WITNESSGAP / CLOSED VERDICT UNION</text>
  <text x="60" y="98" fill="#f4f7fb" font-family="monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">Five ways to state what the evidence licenses</text>
  <text x="60" y="132" fill="#afc2d8" font-family="monospace" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">The taxonomy separates positive certificates, effect-only evidence, and abstention.</text>
  <rect x="60" y="185" width="410" height="176" rx="18" fill="#111f33" stroke="#82e39c" stroke-width="2"/>
  <text x="84" y="223" fill="#82e39c" font-family="monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">identified_singleton</text>
  <text x="84" y="267" fill="#f4f7fb" font-family="monospace" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">one target</text>
  <text x="84" y="304" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">shared by every compatible minimal</text>
  <text x="84" y="329" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">repair</text>
  <rect x="515" y="185" width="410" height="176" rx="18" fill="#111f33" stroke="#6eb7ff" stroke-width="2"/>
  <text x="539" y="223" fill="#6eb7ff" font-family="monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">identified_compound</text>
  <text x="539" y="267" fill="#f4f7fb" font-family="monospace" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">one irreducible set</text>
  <text x="539" y="304" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">multiple targets are jointly required</text>
  <rect x="970" y="185" width="410" height="176" rx="18" fill="#111f33" stroke="#b8a1ff" stroke-width="2"/>
  <text x="994" y="223" fill="#b8a1ff" font-family="monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">alternative_minimal_repairs</text>
  <text x="994" y="267" fill="#f4f7fb" font-family="monospace" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">multiple alternatives</text>
  <text x="994" y="304" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">incomparable minimal repairs remain</text>
  <rect x="285" y="410" width="410" height="176" rx="18" fill="#111f33" stroke="#ffd166" stroke-width="2"/>
  <text x="309" y="448" fill="#ffd166" font-family="monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">effect_only</text>
  <text x="309" y="492" fill="#f4f7fb" font-family="monospace" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">effect observed</text>
  <text x="309" y="529" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">outcome changed without localizing</text>
  <text x="309" y="554" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">origin</text>
  <rect x="745" y="410" width="410" height="176" rx="18" fill="#111f33" stroke="#ff7b86" stroke-width="2"/>
  <text x="769" y="448" fill="#ff7b86" font-family="monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">not_identifiable</text>
  <text x="769" y="492" fill="#f4f7fb" font-family="monospace" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">withhold attribution</text>
  <text x="769" y="529" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">available evidence cannot license a</text>
  <text x="769" y="554" fill="#afc2d8" font-family="monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">point cause</text>
  <rect x="60" y="650" width="1320" height="150" rx="18" fill="#0e2630" stroke="#58d6c9" stroke-width="2"/>
  <text x="88" y="690" fill="#58d6c9" font-family="monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">WORKSPACE-100 v1 PARTICIPANT CLAIM SCHEMA</text>
  <text x="88" y="729" fill="#f4f7fb" font-family="monospace" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">Deliberately narrower than the general verifier</text>
  <rect x="690" y="690" width="310" height="42" rx="21" fill="#163022" stroke="#82e39c" stroke-width="2"/>
  <text x="845" y="718" fill="#f4f7fb" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">identified_singleton</text>
  <rect x="1020" y="690" width="300" height="42" rx="21" fill="#2b1d28" stroke="#ff7b86" stroke-width="2"/>
  <text x="1170" y="718" fill="#f4f7fb" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">not_identifiable</text>
  <text x="88" y="770" fill="#afc2d8" font-family="monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">compound · alternative repairs · effect_only are outside the frozen v1 claim wire</text>
  <line x1="60" y1="834" x2="1380" y2="834" stroke="#2d4665" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="852" width="170" height="42" rx="21" fill="#2b1d28" stroke="#ff7b86" stroke-width="2"/>
  <text x="145" y="880" fill="#ffd7db" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0">official: false</text>
  <text x="250" y="868" fill="#afc2d8" font-family="monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">source: identifiability.VerdictKind · workspace100.evidence.ParticipantClaim</text>
  <text x="250" y="892" fill="#afc2d8" font-family="monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">nonclaim: taxonomy breadth is not Workspace-100 v1 case coverage or a benchmark result</text>
</svg>
