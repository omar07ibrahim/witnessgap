  <text x="250" y="828" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="643" lengthAdjust="spacingAndGlyphs">source: tools/workspace100_candidate_evidence.py check · committed receipt</text>
  <text x="250" y="852" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" textLength="730" lengthAdjust="spacingAndGlyphs">nonclaim: local integrity replay only; independent authentication is not established</text>
