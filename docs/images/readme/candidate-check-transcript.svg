<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">Deterministic candidate-receipt verification transcript</title>
  <desc id="visual-description">A reproducible command and its exact single-line deterministic standard output, followed by exact receipt fields. The command validates local drift pins and the committed candidate receipt; it explicitly does not establish independent authentication.</desc>
  <rect x="0" y="0" width="1600" height="880" fill="#08111f"/>
  <text x="60" y="52" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2" textLength="462" lengthAdjust="spacingAndGlyphs">WORKSPACE-100 / REPRODUCIBLE CLI EVIDENCE</text>
  <text x="60" y="98" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0" textLength="1033" lengthAdjust="spacingAndGlyphs">Candidate receipt check: exact command and stdout</text>
  <text x="60" y="132" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" textLength="927" lengthAdjust="spacingAndGlyphs">The renderer executes this check; the transcript is not a fabricated shell capture.</text>
  <rect x="60" y="175" width="1480" height="115" rx="18" fill="#111f33" stroke="#6eb7ff" stroke-width="2"/>
  <text x="88" y="213" fill="#6eb7ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1" textLength="63" lengthAdjust="spacingAndGlyphs">COMMAND</text>
  <text x="88" y="258" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" textLength="723" lengthAdjust="spacingAndGlyphs">python tools/workspace100_candidate_evidence.py check</text>
  <rect x="60" y="320" width="1480" height="135" rx="18" fill="#0e2630" stroke="#58d6c9" stroke-width="2"/>
  <text x="88" y="358" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0" textLength="186" lengthAdjust="spacingAndGlyphs">EXACT STDOUT · ONE LINE</text>
  <text x="88" y="409" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0" textLength="1298" lengthAdjust="spacingAndGlyphs">verified non-official development candidate receipt 668d2093bef503c0c43300f586427124863d59fc5b75d223d2396fb28da6f313; independent authentication: not established</text>
  <rect x="60" y="490" width="1480" height="255" rx="18" fill="#111f33" stroke="#b8a1ff" stroke-width="2"/>
  <text x="88" y="528" fill="#b8a1ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0" textLength="242" lengthAdjust="spacingAndGlyphs">EXACT COMMITTED RECEIPT FIELDS</text>
  <text x="88" y="570" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" textLength="149" lengthAdjust="spacingAndGlyphs">official: false</text>
  <text x="88" y="604" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" textLength="506" lengthAdjust="spacingAndGlyphs">release_kind: pre_release_reproducibility_candidate</text>
  <text x="88" y="638" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" textLength="774" lengthAdjust="spacingAndGlyphs">receipt_root: 668d2093bef503c0c43300f586427124863d59fc5b75d223d2396fb28da6f313</text>
  <text x="88" y="672" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" textLength="774" lengthAdjust="spacingAndGlyphs">release_root: 005987000c049e34f1a5b1f886bb07bcd1d02d983c16ddfd098cde6e79c82d01</text>
  <text x="88" y="706" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" textLength="516" lengthAdjust="spacingAndGlyphs">root_authentication: not_established_by_this_receipt</text>
  <line x1="60" y1="794" x2="1540" y2="794" stroke="#2d4665" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="812" width="170" height="42" rx="21" fill="#2b1d28" stroke="#ff7b86" stroke-width="2"/>
