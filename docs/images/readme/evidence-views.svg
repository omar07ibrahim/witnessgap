  <text x="764" y="414" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" textLength="268" lengthAdjust="spacingAndGlyphs">+ 1 template epoch probe</text>
  <text x="764" y="486" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="186" lengthAdjust="spacingAndGlyphs">5 exact names across</text>
