<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">Workspace-100 participant evidence views</title>
  <desc id="visual-description">Four production evidence views always expose the failed baseline trace and outcome. Trace-only and owner-probe deduplicate to fifty cases each; epoch-probe and refresh-receipt remain completion-specific at one hundred each.</desc>
  <rect x="0" y="0" width="1440" height="930" fill="#08111f"/>
  <text x="60" y="52" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2" textLength="360" lengthAdjust="spacingAndGlyphs">WORKSPACE-100 / PARTICIPANT WIRE</text>
  <text x="60" y="98" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0" textLength="1118" lengthAdjust="spacingAndGlyphs">Four evidence views, one deliberately narrow envelope</text>
  <text x="60" y="132" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" textLength="1016" lengthAdjust="spacingAndGlyphs">Always present: baseline public_trace + failure outcome. Private routing stays parent-side.</text>
  <rect x="60" y="205" width="300" height="430" rx="18" fill="#111f33" stroke="#6eb7ff" stroke-width="2"/>
  <text x="84" y="246" fill="#6eb7ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" textLength="112" lengthAdjust="spacingAndGlyphs">trace_only</text>
  <text x="84" y="315" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0" textLength="55" lengthAdjust="spacingAndGlyphs">50</text>
  <text x="84" y="346" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="177" lengthAdjust="spacingAndGlyphs">unique public cases</text>
  <line x1="84" y1="375" x2="336" y2="375" stroke="#2d4665" stroke-width="2" stroke-linecap="round"/>
  <text x="84" y="414" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" textLength="224" lengthAdjust="spacingAndGlyphs">no added observation</text>
  <text x="84" y="486" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="214" lengthAdjust="spacingAndGlyphs">baseline public_trace +</text>
  <text x="84" y="510" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="66" lengthAdjust="spacingAndGlyphs">outcome</text>
  <rect x="84" y="562" width="250" height="42" rx="21" fill="#18243b" stroke="#6eb7ff" stroke-width="2"/>
  <text x="209" y="590" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0" textLength="169" lengthAdjust="spacingAndGlyphs">pair-grain dedupe</text>
