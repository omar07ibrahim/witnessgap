  <rect x="1080" y="205" width="300" height="430" rx="18" fill="#111f33" stroke="#58d6c9" stroke-width="2"/>
  <text x="1104" y="246" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" textLength="168" lengthAdjust="spacingAndGlyphs">refresh_receipt</text>
  <text x="1104" y="315" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0" textLength="82" lengthAdjust="spacingAndGlyphs">100</text>
  <text x="1104" y="346" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="177" lengthAdjust="spacingAndGlyphs">unique public cases</text>
  <line x1="1104" y1="375" x2="1356" y2="375" stroke="#2d4665" stroke-width="2" stroke-linecap="round"/>
  <text x="1104" y="414" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" textLength="213" lengthAdjust="spacingAndGlyphs">+ 1 refresh receipt</text>
  <text x="1104" y="486" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="261" lengthAdjust="spacingAndGlyphs">interventions + public_trace</text>
  <text x="1104" y="510" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="84" lengthAdjust="spacingAndGlyphs">+ outcome</text>
  <rect x="1104" y="562" width="250" height="42" rx="21" fill="#22223b" stroke="#b8a1ff" stroke-width="2"/>
  <text x="1229" y="590" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0" textLength="189" lengthAdjust="spacingAndGlyphs">completion-specific</text>
  <rect x="60" y="680" width="1320" height="135" rx="18" fill="#0e2630" stroke="#58d6c9" stroke-width="2"/>
  <text x="88" y="719" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" textLength="191" lengthAdjust="spacingAndGlyphs">NOT ON THE WORKER WIRE</text>
