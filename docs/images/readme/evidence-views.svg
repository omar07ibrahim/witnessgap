  <text x="764" y="246" fill="#ffd166" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" textLength="123" lengthAdjust="spacingAndGlyphs">epoch_probe</text>
  <text x="764" y="315" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0" textLength="82" lengthAdjust="spacingAndGlyphs">100</text>
