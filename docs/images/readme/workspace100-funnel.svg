  <text x="720" y="435" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0" textLength="214" lengthAdjust="spacingAndGlyphs">x4 views per completion</text>
  <line x1="480" y1="600" x2="510" y2="600" stroke="#58d6c9" stroke-width="3" stroke-linecap="round"/>
  <polygon points="510,600 497,592 497,608" fill="#58d6c9"/>
  <text x="495" y="576" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0" textLength="49" lengthAdjust="spacingAndGlyphs">dedupe</text>
  <line x1="930" y1="600" x2="960" y2="600" stroke="#82e39c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="960,600 947,592 947,608" fill="#82e39c"/>
  <text x="945" y="576" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="0" textLength="18" lengthAdjust="spacingAndGlyphs">x4</text>
  <rect x="60" y="735" width="1320" height="80" rx="18" fill="#0e2630" stroke="#58d6c9" stroke-width="2"/>
  <text x="90" y="769" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0" textLength="129" lengthAdjust="spacingAndGlyphs">FROZEN BASELINES</text>
  <text x="90" y="799" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="707" lengthAdjust="spacingAndGlyphs">always_unknown · forced_environment · refresh_success_only · refresh_outcome</text>
  <line x1="60" y1="844" x2="1380" y2="844" stroke="#2d4665" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="862" width="170" height="42" rx="21" fill="#2b1d28" stroke="#ff7b86" stroke-width="2"/>
