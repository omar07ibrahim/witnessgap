  <text x="88" y="573" fill="#6eb7ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="42" font-weight="700" text-anchor="start" letter-spacing="0" textLength="79" lengthAdjust="spacingAndGlyphs">400</text>
  <text x="88" y="613" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" textLength="248" lengthAdjust="spacingAndGlyphs">private assignments</text>
  <text x="88" y="653" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="289" lengthAdjust="spacingAndGlyphs">100 episodes x 4 evidence views</text>
  <rect x="510" y="505" width="420" height="190" rx="18" fill="#111f33" stroke="#58d6c9" stroke-width="2"/>
