  <polygon points="510,285 497,277 497,293" fill="#b8a1ff"/>
  <text x="495" y="260" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="0" textLength="27" lengthAdjust="spacingAndGlyphs">x10</text>
