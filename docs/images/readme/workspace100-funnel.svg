<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="visual-title visual-description">
  <title id="visual-title">Workspace-100 construction funnel</title>
  <desc id="visual-description">Production constructors rebuild five templates, fifty variants and causal-twin pairs, one hundred completions, four hundred private evidence assignments, three hundred unique participant cases, and twelve hundred frozen baseline method-case runs.</desc>
  <rect x="0" y="0" width="1440" height="930" fill="#08111f"/>
  <text x="60" y="52" fill="#58d6c9" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2" textLength="507" lengthAdjust="spacingAndGlyphs">WORKSPACE-100 / FROZEN PROTOCOL CARDINALITIES</text>
  <text x="60" y="98" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0" textLength="1033" lengthAdjust="spacingAndGlyphs">From authored templates to 1,200 method-case runs</text>
  <text x="60" y="132" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" textLength="971" lengthAdjust="spacingAndGlyphs">Every number below is rebuilt from production corpus, projection, and baseline objects.</text>
  <rect x="60" y="190" width="420" height="190" rx="18" fill="#111f33" stroke="#6eb7ff" stroke-width="2"/>
  <text x="88" y="258" fill="#6eb7ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="42" font-weight="700" text-anchor="start" letter-spacing="0" textLength="27" lengthAdjust="spacingAndGlyphs">5</text>
  <text x="88" y="298" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" textLength="118" lengthAdjust="spacingAndGlyphs">templates</text>
  <text x="88" y="338" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="205" lengthAdjust="spacingAndGlyphs">x 10 authored variants</text>
  <rect x="510" y="190" width="420" height="190" rx="18" fill="#111f33" stroke="#b8a1ff" stroke-width="2"/>
  <text x="538" y="258" fill="#b8a1ff" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="42" font-weight="700" text-anchor="start" letter-spacing="0" textLength="53" lengthAdjust="spacingAndGlyphs">50</text>
  <text x="538" y="298" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" textLength="274" lengthAdjust="spacingAndGlyphs">variants = twin pairs</text>
  <text x="538" y="338" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="270" lengthAdjust="spacingAndGlyphs">one pair per authored variant</text>
  <rect x="960" y="190" width="420" height="190" rx="18" fill="#111f33" stroke="#ffd166" stroke-width="2"/>
  <text x="988" y="258" fill="#ffd166" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="42" font-weight="700" text-anchor="start" letter-spacing="0" textLength="79" lengthAdjust="spacingAndGlyphs">100</text>
  <text x="988" y="298" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" textLength="235" lengthAdjust="spacingAndGlyphs">sealed completions</text>
  <text x="988" y="338" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="307" lengthAdjust="spacingAndGlyphs">2 incompatible completions / pair</text>
