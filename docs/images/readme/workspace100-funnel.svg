  <text x="538" y="653" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="307" lengthAdjust="spacingAndGlyphs">deduplicated by complete evidence</text>
  <rect x="960" y="505" width="420" height="190" rx="18" fill="#111f33" stroke="#82e39c" stroke-width="2"/>
  <text x="988" y="573" fill="#82e39c" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="42" font-weight="700" text-anchor="start" letter-spacing="0" textLength="131" lengthAdjust="spacingAndGlyphs">1,200</text>
  <text x="988" y="613" fill="#f4f7fb" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0" textLength="209" lengthAdjust="spacingAndGlyphs">method-case runs</text>
  <text x="988" y="653" fill="#afc2d8" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" textLength="205" lengthAdjust="spacingAndGlyphs">4 frozen methods x 300</text>
